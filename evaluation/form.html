<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <form method="post">
        <h2>Donor Information</h2>
        <fieldset>
            <table>
                <tr>
                    <td><label for="First name">First Name*:</label></td>
                    <td><input type="text" id="First name" name="First name" required></td>
                </tr>

                <tr>
                    <td><label for="Last name">Last Name*:</label></td>
                    <td><input type="text" id="Last name" name="Last name" required></td>
                </tr>

                <tr>
                    <td><label for="Company">Company:</label></td>
                    <td><input type="text" id="company" name="Company" required></td>
                </tr>

                <tr>
                    <td><label for="Address 1">Address 1*:</label></td>
                    <td><input type="text" id="Address 1" name="Address 1" required></td>
                </tr>

                <tr>
                    <td><label for="Address 2">Address 2*:</label></td>
                    <td><input type="text" id="Address 2" name="Address 2" required></td>
                </tr>

                <tr>
                    <td><label for="City">City*:</label></td>
                    <td><input type="text" id="City" name="City" required></td>
                </tr>

                <tr>
                    <td><label for="State">State*:</label></td>
                    <td>
                        <select id="State" name="State">
                            <option>Select a State</option>
                            <option>Gazipur</option>
                            <option>Narsingdi</option>
                            <option>Tangail</option>
                            <option>Manikganj</option>

                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="Zip Code">Zip Code*:</label></td>
                    <td><input type="number" id="Zip Code" name="Zip Code" required></td>
                </tr>

                <tr>
                    <td><label for="Country">Country*:</label></td>
                    <td>
                        <select id="Country" name="Country">
                            <option>Select a Country</option>
                            <option>Bangladesh</option>
                            <option>India</option>
                            <option>Pakistan</option>
                            <option>Australia</option>

                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="Phone">Phone*:</label></td>
                    <td><input type="number" id="Phone" name="Phone" required></td>
                </tr>

                <tr>
                    <td><label for="Fax">Fax*:</label></td>
                    <td><input type="text" id="Fax" name="Fax" required></td>
                </tr>

                <tr>
                    <td><label for="email">Email*:</label></td>
                    <td><input type="email" id="email" name="email" required></td>
                </tr>

                <tr>
                    <td><label>Donation Amount*</label>
                        <p>(Check a button or type in your amount)</p>
                    </td>
                    <td><input type="radio" name="donation amount" value="none"> None
                        <input type="radio" name="donation amount" value="$50"> $50
                        <input type="radio" name="donation amount" value="$75"> $75
                        <input type="radio" name="donation amount" value="$100"> $100
                        <input type="radio" name="donation amount" value="$250"> $250
                        <input type="radio" name="donation amount" value="other"> Other
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td><label for="Other Amount">Other Amount $</label>
                        <input type="number" id="Other Amount" name="Other Amount" required>
                    </td>
                </tr>

                <tr>
                    <td><label>Recurring Donation</label>
                        <p>(Check if yes)</p>
                    </td>
                    <td><input type="checkbox" name="donation" value="I am interested in giving on a regular basis."> I
                        am interested in giving on a regular basis.</td>
                </tr>

                <tr>
                    <td></td>
                    <td><label for="Credit Card">Monthly Credit Card $</label>
                        <input type="number" id="Credit Card" name="Credit Card" required>
                    <td><label for="For">For</label>
                        <input type="number" id="For" name="For" required>

                    <td><label for="Months">Months</label></td>


                    </td>
                </tr>

            </table>
        </fieldset>
    </form>

</body>

</html>
